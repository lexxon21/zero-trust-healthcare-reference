    coverage: "designed"
    coverage_note: "Identity, endpoint, firewall allow and deny, NAC, IoMT sensor, broker session, and EHR audit logs are collected in PIP-SIEM; IoMT sensor logs cover the three hospitals only (RR-14). Recorded vendor broker sessions are the audit record of business associate access (02 section 12). The emergency access path is examined at Tier 0 priority: every sign-in by the two tenant emergency access accounts, every change to grp-ca-emergency-access, and all audit activity by or on the accounts raise an alert (03 section 5, ADR-004 decision 9; SN-06 and SN-07). ADR-009 decision 4 adds recovery-plane events, handled at Tier 0 priority, plus an audit trail that production identities cannot change; rules for those logs depend on the product chosen and are not built. Per-record review of EHR access is a privacy monitoring function outside the design (RR-01). The detection pack's 22 rules examine identity, endpoint, mailbox, directory, and Azure activity; no rule examines firewall, NAC, IoMT sensor, broker session, or EHR audit logs yet (coverage-map.md sections 4 and 5)."
