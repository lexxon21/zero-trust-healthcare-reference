        source: "SRC-ECFR-164-308"
        locator: "45 CFR 164.308(a)(5)(ii)(C)"
    applicability: "applicable"
    coverage: "designed"
    coverage_note: "Risk-based Conditional Access (CA-17, CA-18) and identity risk signals for cloud and on-premises sign-ins. The detection pack adds five log-in rules (DX-03, DX-07, SN-01, SN-04, SN-06), all untested templates. DX-07's logon signal needs Defender for Endpoint on the IDS-SYNC servers, which the design does not yet state (threat-model.md TM-A4), so it has no data until the architecture decides. SN-06 is the alert on every emergency access account sign-in, successful or failed, that 03 section 5 specifies. Reporting discrepancies is procedural."
