    coverage_note: "ADR-009 sets the requirements for every copy Contoso would restore ePHI from. Scope: the local-first clinical stores, RES-LEGACY, RES-FILES, and RES-AZ-WORKLOADS, plus the Tier 0 identity systems they cannot be restored without (IDS-AD, PIP-PKI) and the keys that encrypted data depends on; whether to keep copies of Microsoft 365 data is left to Contoso's criticality analysis. Properties: at least one immutable and one offline copy (one copy may be both), retention that reaches back past the likely start of an undetected intrusion, and encryption with keys recoverable without production Tier 0. The backup implementation (products, topology, where copies are kept, retention periods) is out of scope (01, Out of scope), so the procedures that create and maintain the copies are not designed, and RR-11 records recovery capability as unverified. The linked rules watch for deletion of recovery points where they exist; they are not a backup plan."
