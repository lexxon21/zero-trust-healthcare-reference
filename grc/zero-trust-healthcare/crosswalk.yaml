  - id: "XW-07"
    source:
      framework: "hipaa-security-rule"
      framework_version: "45 CFR Part 164 Subpart C, as in force (eCFR text current through 2026-09-30)"
      id: "164.308(a)(3)(i)"
      kind: "standard"
      title: "Workforce security"
      designation: "standard"
      summary: "Make sure workforce members have appropriate access to ePHI and that those without authorized access cannot obtain it."
      citation:
        source: "SRC-ECFR-164-308"
        locator: "45 CFR 164.308(a)(3)(i)"
    applicability: "applicable"
    coverage: "designed"
