  - id: "XW-51"
    source:
      framework: "hipaa-security-rule"
      framework_version: "45 CFR Part 164 Subpart C, as in force (eCFR text current through 2026-09-30)"
      id: "164.312(d)"
      kind: "standard"
      title: "Person or entity authentication"
      designation: "standard"
      summary: "Have procedures to verify that a person or entity seeking access to ePHI is the one claimed."
      citation:
        source: "SRC-ECFR-164-312"
        locator: "45 CFR 164.312(d)"
    applicability: "applicable"
    coverage: "designed"
    coverage_note: "Phishing-resistant MFA by persona, certificate badges on shared clinical workstations, home-tenant methods for partners under inbound trust, and device certificates for network admission. Legacy applications that need Kerberos or NTLM (RES-LEGACY) sit in the enclave, where NTLM is audited and then restricted (ADR-005). Patients and proxies sign in through IDS-CIAM, outside the workforce tenant; their sign-in methods and identity proofing are out of scope (01, Out of scope; 03 section 8)."
    csf_targets:
      - id: "PR.AA-03"
        relationship: "equivalent"
        rationale: "Both require authenticating the subject before access. CSF also names services and hardware, which the design covers with workload identities and 802.1X device certificates."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, PR.AA-03"
      - id: "PR.AA-02"
        relationship: "related"
        rationale: "Proofing before a credential is issued."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, PR.AA-02"
      - id: "PR.AA-04"
        relationship: "related"
        rationale: "Federated assertions from partner tenants accepted under inbound trust."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, PR.AA-04"
    cde_scope: true
    pci_targets:
      - id: "8.2.7"
        relationship: "related"
        shared_csf: ["PR.AA-05", "DE.CM-06"]
        saq_path_status: "not-applicable-by-design"
        full_assessment_status: "required-where-access-exists"
        rationale: "Third-party remote access enabled only when needed and monitored; no such account exists for Z-CDE, and vendor sessions elsewhere already follow this pattern."
        citation:
          source: "SRC-PCI-DSS-401"
          locator: "Requirement 8.2.7"
      - id: "8.4.1"
        relationship: "related"
        shared_csf: ["PR.AA-03"]
        saq_path_status: "not-applicable-by-design"
        full_assessment_status: "required-where-access-exists"
        rationale: "No administrative access path into Z-CDE exists; any future path would use phishing-resistant MFA through PEP-VENDOR-BROKER."
        citation:
          source: "SRC-PCI-DSS-401"
          locator: "Requirement 8.4.1"
      - id: "8.4.2"
        relationship: "related"
        shared_csf: ["PR.AA-03"]
        saq_path_status: "not-applicable-by-design"
        full_assessment_status: "required-where-access-exists"
        rationale: "No non-console access into Z-CDE exists by design. If access were ever created, v4.0.1's new Applicability Note becomes relevant: the requirement does not apply to user accounts authenticated only with phishing-resistant factors, and the design already uses such factors elsewhere (ADR-003)."
        citation:
          source: "SRC-PCI-DSS-401"
          locator: "Requirement 8.4.2"
      - id: "8.4.3"
        relationship: "related"
        shared_csf: ["PR.AA-03"]
        saq_path_status: "not-applicable-by-design"
        full_assessment_status: "required-where-access-exists"
        rationale: "No remote access path can reach Z-CDE; the design retires user VPN and admits only outbound traffic to the P2PE provider."
        citation:
          source: "SRC-PCI-DSS-401"
          locator: "Requirement 8.4.3"
      - id: "8.5.1"
        relationship: "related"
        shared_csf: ["PR.AA-03"]
        saq_path_status: "not-applicable-by-design"
        full_assessment_status: "required-where-access-exists"
        rationale: "The phishing-resistant methods used elsewhere would meet the MFA system properties if CDE access were ever created."
        citation:
          source: "SRC-PCI-DSS-401"
          locator: "Requirement 8.5.1"
