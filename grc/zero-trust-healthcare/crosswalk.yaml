# ---------------------------------------------------------------- 45 CFR 164.308 Administrative safeguards
  - id: "XW-01"
    source:
      framework: "hipaa-security-rule"
      framework_version: "45 CFR Part 164 Subpart C, as in force (eCFR text current through 2026-09-30)"
      id: "164.308(a)(1)(i)"
      kind: "standard"
      title: "Security management process"
      designation: "standard"
      summary: "Have policies and procedures that prevent, detect, contain, and correct security violations."
      citation:
        source: "SRC-ECFR-164-308"
        locator: "45 CFR 164.308(a)(1)(i)"
    applicability: "applicable"
    coverage: "partial"
    coverage_note: "The design supplies prevention (identity and segmentation enforcement points), detection (PIP-SIEM, PIP-XDR), and containment (PEP-HOST, PE-NETWORK). The governing policies and the program around them are organizational work, started in 05 WP-0.1."
    csf_targets:
      - id: "GV.PO-01"
        relationship: "partial"
        rationale: "Covers the policy half of the standard; the prevent, detect, contain, and correct outcomes map on the implementation specification rows."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, GV.PO-01"
      - id: "GV.RM-01"
        relationship: "related"
        rationale: "Agreed risk management objectives frame what the security management process has to achieve."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, GV.RM-01"
    cde_scope: false
    pci_targets: []
    architecture:
      components: ["PIP-SIEM", "PIP-XDR", "PEP-HOST", "PE-NETWORK"]
      zones: []
      policies: []
      flows: []
      residual_risks: []
      artifacts:
        - doc: "architecture"
          file: "01-scenario-and-assumptions.md"
          section: "Design principles"
        - doc: "architecture"
          file: "05-ztmm-maturity-roadmap.md"
          section: "4"
        - doc: "architecture"
          file: "02-reference-architecture.md"
          section: "13"
    detections:
      - doc: "detections"
        file: "playbooks/ir-identity-compromise.md"
        purpose: "Reference procedure to contain, eradicate, and recover from identity compromise: the contain and correct elements of this standard, for one incident class"
      - doc: "detections"
        file: "playbooks/ir-ransomware.md"
        purpose: "Reference procedure to contain ransomware and data extortion under the clinical safety gate, eradicate it, and restore or rebuild (sections 6.2 to 6.5): the contain and correct elements of this standard, for a second incident class; its recovery steps depend on ADR-009 requirements that are not implemented"
    notes: ""
  - id: "XW-02"
    source:
      framework: "hipaa-security-rule"
      framework_version: "45 CFR Part 164 Subpart C, as in force (eCFR text current through 2026-09-30)"
      id: "164.308(a)(1)(ii)(A)"
      kind: "implementation-specification"
      title: "Risk analysis"
      designation: "required"
      summary: "Accurately and thoroughly assess the risks and vulnerabilities to the confidentiality, integrity, and availability of the ePHI the entity holds."
      citation:
        source: "SRC-ECFR-164-308"
        locator: "45 CFR 164.308(a)(1)(ii)(A)"
    applicability: "applicable"
    coverage: "partial"
    coverage_note: "The design builds the inputs a risk analysis needs: one asset inventory that includes medical devices, documented data flows, vulnerability data gathered without active scanning, and a stated residual-risk list (02 section 13). At the 22 clinics, medical device inventory and classification come from NAC profiling and clinical engineering records, because the clinics are outside passive sensor coverage (RR-14). risk-register.md is a reference example of the method, not Contoso's risk analysis."
    csf_targets:
      - id: "ID.RA-05"
        relationship: "partial"
        rationale: "Closest outcome: threats, vulnerabilities, likelihoods, and impacts used to understand inherent risk. HIPAA adds the accurate-and-thorough test and scopes it to ePHI confidentiality, integrity, and availability."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, ID.RA-05"
      - id: "ID.RA-01"
        relationship: "partial"
        rationale: "Identifying and recording vulnerabilities is one required input, including passive data for medical devices."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, ID.RA-01"
      - id: "ID.RA-03"
        relationship: "partial"
        rationale: "Identifying internal and external threats is one required input."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, ID.RA-03"
      - id: "ID.RA-04"
        relationship: "partial"
        rationale: "Impacts and likelihoods are the remaining inputs the analysis needs."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, ID.RA-04"
      - id: "ID.AM-07"
        relationship: "related"
        rationale: "An inventory of where ePHI lives sets the scope of the analysis."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, ID.AM-07"
    cde_scope: true
    pci_targets:
      - id: "1.2.3"
        relationship: "related"
        shared_csf: ["ID.AM-03"]
        saq_path_status: "performed-anyway"
        full_assessment_status: "required"
        rationale: "Both depend on an accurate picture of connections; the PCI diagram covers Z-CDE, the HIPAA analysis covers systems that hold ePHI."
        citation:
          source: "SRC-PCI-DSS-401"
          locator: "Requirement 1.2.3"
      - id: "1.2.4"
        relationship: "related"
        shared_csf: ["ID.AM-03"]
        saq_path_status: "performed-anyway"
        full_assessment_status: "required"
        rationale: "Data-flow documentation feeds both; Diagram 6 in 04-segmentation.md is the account-data starting point."
        citation:
          source: "SRC-PCI-DSS-401"
          locator: "Requirement 1.2.4"
      - id: "12.3.1"
        relationship: "related"
        shared_csf: ["ID.RA-04"]
        saq_path_status: "performed-anyway"
        full_assessment_status: "required"
        rationale: "A targeted risk analysis for one activity's frequency (here POI inspection under 9.5.1.2.1) is far narrower than the HIPAA risk analysis but uses the same method."
        citation:
          source: "SRC-PCI-DSS-401"
          locator: "Requirement 12.3.1"
      - id: "12.5.2"
        relationship: "related"
        shared_csf: ["ID.AM-03"]
        saq_path_status: "performed-anyway"
        full_assessment_status: "required"
        rationale: "Confirming PCI scope each year parallels keeping the HIPAA analysis scope accurate; the ePHI and account-data scopes differ by design."
        citation:
          source: "SRC-PCI-DSS-401"
          locator: "Requirement 12.5.2"
    architecture:
      components: ["PIP-ASSET-INV", "PIP-IOMT-SENSOR", "PIP-VULN", "PIP-DATA-CLASS", "RES-POI"]
      zones: ["Z-IOMT", "Z-CDE"]
      policies: []
      flows: []
      residual_risks: ["RR-14"]
      artifacts:
        - doc: "architecture"
          file: "04-segmentation.md"
          section: "3"
        - doc: "architecture"
          file: "adr/ADR-006-iomt-network-enforced-segmentation.md"
          section: "Decision"
        - doc: "architecture"
          file: "02-reference-architecture.md"
          section: "13"
        - doc: "architecture"
          file: "04-segmentation.md"
          section: "7"
        - doc: "grc"
          file: "risk-register.md"
          section: "3"
    detections: []
    notes: ""
  - id: "XW-03"
    source:
      framework: "hipaa-security-rule"
      framework_version: "45 CFR Part 164 Subpart C, as in force (eCFR text current through 2026-09-30)"
      id: "164.308(a)(1)(ii)(B)"
      kind: "implementation-specification"
      title: "Risk management"
      designation: "required"
      summary: "Put security measures in place that reduce risks and vulnerabilities to a reasonable and appropriate level."
      citation:
        source: "SRC-ECFR-164-308"
        locator: "45 CFR 164.308(a)(1)(ii)(B)"
    applicability: "applicable"
    coverage: "partial"
    coverage_note: "Most of the design set is risk reduction: segmentation, phishing-resistant MFA, just-in-time access, and the legacy enclave. Deciding what is reasonable and appropriate, and tracking treatment, is the risk management process; risk-register.md shows the form."
    csf_targets:
      - id: "ID.RA-06"
        relationship: "partial"
        rationale: "Risk responses are chosen, planned, and tracked; HIPAA sets the bar at reduction to a reasonable and appropriate level."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, ID.RA-06"
      - id: "GV.RM-02"
        relationship: "related"
        rationale: "Risk appetite and tolerance statements give 'reasonable and appropriate' a working definition."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, GV.RM-02"
      - id: "ID.RA-07"
        relationship: "related"
        rationale: "Exceptions with an owner, an expiry date, and a log entry (principle P-5) are tracked risk decisions."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, ID.RA-07"
    cde_scope: false
    pci_targets: []
    architecture:
      components: ["PE-IDENTITY", "IGA-ENTRA", "PE-NETWORK", "PEP-NET-ZONE", "PEP-ENCLAVE-GW"]
      zones: []
      policies: []
      flows: []
      residual_risks: []
      artifacts:
        - doc: "architecture"
          file: "05-ztmm-maturity-roadmap.md"
          section: "4"
        - doc: "architecture"
          file: "adr/ADR-005-legacy-kerberos-ntlm-enclave.md"
          section: "Decision"
        - doc: "architecture"
          file: "adr/ADR-006-iomt-network-enforced-segmentation.md"
          section: "Decision"
        - doc: "grc"
          file: "risk-register.md"
          section: "3"
    detections:
      - doc: "detections"
        file: "kql/defender-xdr/dx03-entra-session-reuse-new-country-or-client.kql"
        purpose: "Compensating detection for session token replay where continuous access evaluation does not reach the EHR (RR-03); risk-register.md lists it as a control for R-01"
      - doc: "detections"
        file: "kql/defender-xdr/dx04-exchange-inbox-rule-hide-or-forward.kql"
        purpose: "Compensating detection for mail-hiding and forwarding rules in the help-desk takeover path, where detections-index.md says prevention has a gap"
      - doc: "detections"
        file: "kql/sentinel/sn01-mfa-method-change-then-new-country-or-inbox-rule.kql"
        purpose: "Compensating detection for help-desk MFA enrollment fraud (R-02); its banking-change link is not built because payer, payroll, and ERP logs are not in Sentinel (A-17)"
      - doc: "detections"
        file: "kql/sentinel/sn03-oauth-consent-and-service-principal-credential-add.kql"
        purpose: "Compensating detection for illicit consent and new service principal credentials (R-06); managed identity sign-in monitoring is not built (coverage-map.md section 3, item 11)"
    notes: ""
  - id: "XW-04"
    source:
      framework: "hipaa-security-rule"
      framework_version: "45 CFR Part 164 Subpart C, as in force (eCFR text current through 2026-09-30)"
      id: "164.308(a)(1)(ii)(C)"
      kind: "implementation-specification"
      title: "Sanction policy"
      designation: "required"
      summary: "Apply appropriate sanctions to workforce members who do not follow the security policies and procedures."
      citation:
        source: "SRC-ECFR-164-308"
        locator: "45 CFR 164.308(a)(1)(ii)(C)"
    applicability: "applicable"
    coverage: "procedural"
    coverage_note: "An HR and compliance process. The design only supplies evidence an investigation would use, such as sign-in logs, EHR audit trails, and PIM records."
    csf_targets:
      - id: "GV.RR-04"
        relationship: "partial"
        rationale: "Human resources practices include disciplinary processes; HIPAA specifically requires sanctions for policy violations."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, GV.RR-04"
      - id: "GV.PO-01"
        relationship: "related"
        rationale: "A policy that is enforced implies consequences for violating it."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, GV.PO-01"
    cde_scope: false
    pci_targets: []
    architecture:
      components: []
      zones: []
      policies: []
      flows: []
      residual_risks: []
      artifacts: []
