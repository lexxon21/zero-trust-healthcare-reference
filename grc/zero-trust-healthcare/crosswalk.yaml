  - id: "XW-45"
    source:
      framework: "hipaa-security-rule"
      framework_version: "45 CFR Part 164 Subpart C, as in force (eCFR text current through 2026-09-30)"
      id: "164.312(a)(2)(ii)"
      kind: "implementation-specification"
      title: "Emergency access procedure"
      designation: "required"
      summary: "Establish, and implement as needed, procedures for obtaining necessary ePHI during an emergency."
      citation:
        source: "SRC-ECFR-164-312"
        locator: "45 CFR 164.312(a)(2)(ii)"
    applicability: "applicable"
    coverage: "partial"
    coverage_note: "Three mechanisms support it: EHR clinical break-the-glass (its configuration is out of scope), the local clinical plane during cloud outages, and tenant emergency accounts plus sealed AD recovery credentials for administrative recovery (03 section 5, ADR-008). The tenant accounts stay usable through grp-ca-emergency-access, which exempts them from the Conditional Access policies that block or restrict sign-in. The group is a Tier 0 object (ADR-004 decision 9): an administrator can change it only through an approved Tier 0 activation, but the two emergency accounts and Tier 0 workload identities can change it, or an emergency account's credentials, with no approval, and on those paths the alerts (SN-07 for the change, SN-06 for any sign-in it enables) are the only control (RR-16). SN-06 alerts on every sign-in by the two accounts, so each use is confirmed as a scheduled test, a declared emergency, or misuse. SN-07 alerts on every change to the group and all audit activity by or on the accounts, so a change that would leave the procedure without a usable account, such as an account removed from the group or disabled, is reviewed when it happens. Both are untested templates."
    csf_targets:
      - id: "PR.IR-03"
        relationship: "related"
        rationale: "Resilience that keeps ePHI reachable when normal paths fail."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, PR.IR-03"
      - id: "PR.AA-05"
        relationship: "related"
        rationale: "Controlled exceptions to normal access rules."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, PR.AA-05"
