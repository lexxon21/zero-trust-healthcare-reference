    applicability: "applicable"
    coverage: "designed"
    coverage_note: "PIM eligibility expiry, access reviews (quarterly for Tier 0 as an example cadence), and mover events from IDS-SOR establish and modify access; IGA-ENTRA keeps the records. Membership of grp-ca-emergency-access exempts an account from every enforced Conditional Access policy that blocks or restricts sign-in, so the design treats a change to it as a Tier 0 access modification: an administrator makes it through an approved Tier 0 activation against a change record, and every change alerts, including those an emergency account or a Tier 0 workload identity can make without approval (03 section 5, ADR-004 decision 9). On those unapproved paths the alert is the only control (RR-16)."
