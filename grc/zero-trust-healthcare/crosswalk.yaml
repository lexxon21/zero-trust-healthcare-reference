  - id: "XW-47"
    source:
      framework: "hipaa-security-rule"
      framework_version: "45 CFR Part 164 Subpart C, as in force (eCFR text current through 2026-09-30)"
      id: "164.312(a)(2)(iv)"
      kind: "implementation-specification"
      title: "Encryption and decryption"
      designation: "addressable"
      summary: "Put in place a mechanism to encrypt and decrypt ePHI."
      citation:
        source: "SRC-ECFR-164-312"
        locator: "45 CFR 164.312(a)(2)(iv)"
    applicability: "applicable"
    coverage: "partial"
    coverage_note: "Every class of store that holds ePHI has an at-rest requirement (02 section 7, Data at rest by data-store class): Microsoft 365 data (the provider's managed encryption, confirmed in Contoso's risk analysis, plus sensitivity labels with encryption for labeled ePHI), file services (volume encryption, plus labels), managed endpoints (full-disk or platform encryption checked by the compliance policy, with recovery keys escrowed), personal phones under app protection (organization data encrypted by the app protection policy), datacenter clinical stores (encryption at the guest volume or database layer, with the keys that unlock a copy held outside it), Azure workloads (platform encryption, verified continuously), managed file transfer (encrypted at rest and deleted after receipt), medical devices (where the device supports it), and backup copies (keys recoverable without production Tier 0). Coverage is partial for two reasons. Medical devices that cannot encrypt are owned, dated exceptions (RR-15): the design documents them as 45 CFR 164.306(d)(3) requires, and whether their compensating measures are adequate is Contoso's risk analysis decision. Backup copy encryption rests on SVC-BACKUP, whose implementation is not designed (ADR-009, RR-11). Storage-layer-only encryption and legacy platforms that cannot encrypt are further owned, dated exceptions. Meeting a requirement is not, on its own, a finding that ePHI is secured under the HHS guidance (notification-clocks.md section 2.2)."
    csf_targets:
      - id: "PR.DS-01"
        relationship: "partial"
        rationale: "Protecting data at rest; HIPAA asks for an encryption and decryption mechanism."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, PR.DS-01"
      - id: "PR.DS-10"
        relationship: "related"
        rationale: "Labels with encryption also protect data in use in Microsoft 365 applications."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, PR.DS-10"
