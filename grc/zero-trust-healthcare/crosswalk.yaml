  - id: "XW-05"
    source:
      framework: "hipaa-security-rule"
      framework_version: "45 CFR Part 164 Subpart C, as in force (eCFR text current through 2026-09-30)"
      id: "164.308(a)(1)(ii)(D)"
      kind: "implementation-specification"
      title: "Information system activity review"
      designation: "required"
      summary: "Regularly review records of system activity, such as audit logs, access reports, and security incident tracking reports."
      citation:
        source: "SRC-ECFR-164-308"
        locator: "45 CFR 164.308(a)(1)(ii)(D)"
    applicability: "applicable"
    coverage: "designed"
    coverage_note: "Collection and correlation are designed: identity, endpoint, zone firewall, NAC, IoMT sensor, and broker session logs in PIP-SIEM and PIP-XDR. IoMT sensor records exist for the three hospitals only, because clinic medical devices are outside passive sensor coverage (RR-14). The detection pack's 22 rules, all untested templates, automate part of the review. The review cadence, who performs it, triage, and review of the records no rule covers yet (coverage-map.md section 4) are procedural."
    csf_targets:
      - id: "DE.CM-03"
        relationship: "partial"
        rationale: "Monitoring personnel activity and technology usage; HIPAA requires a procedure for regular review of activity records."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, DE.CM-03"
      - id: "DE.AE-02"
        relationship: "partial"
        rationale: "Analyzing potentially adverse events is the substance of the review."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, DE.AE-02"
      - id: "PR.PS-04"
        relationship: "related"
        rationale: "Log records must exist and be available before anyone can review them."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, PR.PS-04"
      - id: "DE.AE-03"
        relationship: "related"
        rationale: "Correlating identity, endpoint, network, and IoMT sources makes review practical at Contoso's scale."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, DE.AE-03"
    cde_scope: false
    pci_targets: []
    architecture:
      components: ["PIP-SIEM", "PIP-XDR", "PIP-ID-RISK", "PEP-NET-ZONE", "PEP-VENDOR-BROKER"]
      zones: []
      policies: []
      flows: []
      residual_risks: ["RR-14"]
      artifacts:
