    source:
      framework: "hipaa-security-rule"
      framework_version: "45 CFR Part 164 Subpart C, as in force (eCFR text current through 2026-09-30)"
      id: "164.312(c)(1)"
      kind: "standard"
      title: "Integrity"
      designation: "standard"
      summary: "Have policies and procedures that protect ePHI from improper alteration or destruction."
      citation:
        source: "SRC-ECFR-164-312"
        locator: "45 CFR 164.312(c)(1)"
    applicability: "applicable"
    coverage: "partial"
    coverage_note: "Access control, application control, and the web application firewall limit who and what can change ePHI. ADR-009 requires immutable copies, which no identity can alter or delete during their retention period, so ePHI destroyed or altered in production can be restored; the recovery implementation is not designed (RR-11). Integrity controls inside the EHR are out of scope (01)."
    csf_targets:
      - id: "PR.DS-01"
        relationship: "partial"
        rationale: "Integrity of data at rest."
        citation:
          source: "SRC-NIST-CSWP29"
