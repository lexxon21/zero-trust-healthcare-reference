      id: "164.312(a)(2)(iii)"
      kind: "implementation-specification"
      title: "Automatic logoff"
      designation: "addressable"
      summary: "Use electronic procedures that end a session after a set period of inactivity."
      citation:
        source: "SRC-ECFR-164-312"
        locator: "45 CFR 164.312(a)(2)(iii)"
    applicability: "applicable"
    coverage: "partial"
    coverage_note: "The EHR's own inactivity timeout covers EHR sessions, and Microsoft 365 idle session timeout covers Microsoft 365 web apps on the unmanaged browsers that CA-10 serves, with the limits 02 section 9 states: where a browser blocks third-party cookies, only the CA-10 sign-in frequency bounds the session. Sign-in frequency caps session length and the badge-removal lock ends access when a clinician walks away, but neither is an inactivity timeout. On shared clinical workstations, a locked session, including one left behind by Switch User, is signed out after an idle period Contoso sets (ADR-003, Consequences). Inactivity controls for idle sessions that are not locked, for other clinical applications, and for desktop and mobile clients on other devices are not specified in the design set."
    csf_targets:
      - id: "PR.AA-05"
        relationship: "related"
        rationale: "Session limits are part of enforcing access."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, PR.AA-05"
      - id: "PR.AA-03"
        relationship: "related"
        rationale: "Reauthentication after the session ends."
        citation:
          source: "SRC-NIST-CSWP29"
          locator: "Appendix A, PR.AA-03"
