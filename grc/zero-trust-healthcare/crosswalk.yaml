          file: "02-reference-architecture.md"
          section: "3"
        - doc: "architecture"
          file: "03-identity-and-access.md"
          section: "4"
        - doc: "architecture"
          file: "04-segmentation.md"
          section: "6"
    detections:
      - doc: "detections"
        file: "kql/defender-xdr/dx01-recovery-inhibition-shadow-copy-backup-deletion.kql"
        purpose: "Automates review of endpoint process records for shadow copy deletion, backup catalog deletion, and boot recovery changes"
      - doc: "detections"
        file: "kql/defender-xdr/dx02-mass-file-rename-encryption-burst.kql"
        purpose: "Automates review of file activity records for one process renaming many files to a new extension across many folders"
      - doc: "detections"
        file: "kql/defender-xdr/dx03-entra-session-reuse-new-country-or-client.kql"
        purpose: "Automates review of Entra sign-in records for one session used from several countries, or from a new network and client"
      - doc: "detections"
        file: "kql/defender-xdr/dx04-exchange-inbox-rule-hide-or-forward.kql"
        purpose: "Automates review of Exchange Online records for inbox rules and mailbox settings that forward, delete, or hide mail"
      - doc: "detections"
        file: "kql/defender-xdr/dx05-mdi-tier0-credential-access-alert-chain.kql"
        purpose: "Automates review of Defender for Identity alerts from Tier 0 servers, chained per account, device, or address"
      - doc: "detections"
        file: "kql/defender-xdr/dx06-dcsync-replication-from-non-dc.kql"
        purpose: "Automates review of directory replication records for requests from hosts that are not domain controllers"
      - doc: "detections"
        file: "kql/defender-xdr/dx07-entra-connect-sync-server-anomalies.kql"
        purpose: "Automates review of logon and process records on the Entra Connect servers, plus sync-identity alerts. The logon and process records need Defender for Endpoint on the IDS-SYNC servers, which the design does not yet state (threat-model.md TM-A4); until it does, this review rests on the Defender for Identity sync-identity alerts"
      - doc: "detections"
        file: "kql/defender-xdr/dx08-workstation-peer-smb-and-tool-transfer.kql"
        purpose: "Automates review of network and file records for SMB between workstations and executables written over SMB"
      - doc: "detections"
        file: "kql/defender-xdr/dx09-endpoint-protection-tampering.kql"
        purpose: "Automates review of tamper protection events, tamper alerts, and Defender Antivirus preference commands"
      - doc: "detections"
        file: "kql/sentinel/sn01-mfa-method-change-then-new-country-or-inbox-rule.kql"
        purpose: "Automates review of audit, sign-in, and mailbox records for an MFA method change followed by a new-country sign-in or a mail rule"
      - doc: "detections"
        file: "kql/sentinel/sn02-entra-control-plane-and-vendor-activation-changes.kql"
        purpose: "Automates review of Entra audit records for control-plane changes and off-hours vendor session group activations"
      - doc: "detections"
        file: "kql/sentinel/sn03-oauth-consent-and-service-principal-credential-add.kql"
        purpose: "Automates review of Entra audit records for sensitive consent grants and new application or service principal credentials"
      - doc: "detections"
        file: "kql/sentinel/sn04-device-code-and-authentication-transfer-signins.kql"
        purpose: "Automates review of sign-in records for device code and authentication transfer flows outside the CA-20 exception"
      - doc: "detections"
        file: "kql/sentinel/sn05-azure-backup-and-restore-point-deletion.kql"
        purpose: "Automates review of Azure activity records for deletion of recovery assets and vault security changes"
      - doc: "detections"
        file: "kql/sentinel/sn06-emergency-access-account-signin.kql"
        purpose: "Automates review of interactive and non-interactive sign-in records for every sign-in, successful or failed, by the two tenant emergency access accounts"
      - doc: "detections"
        file: "kql/sentinel/sn07-emergency-access-group-and-account-audit-activity.kql"
        purpose: "Automates review of Entra audit records for every change to grp-ca-emergency-access, grp-admins-t0, and grp-admins-t1, and all audit activity by or on the two tenant emergency access accounts, matched by object ID"
      - doc: "detections"
        file: "sigma/proc_creation_win_recovery_inhibition_utilities.yml"
        purpose: "Portable Sigma form of DX-01 over Windows process creation events"
      - doc: "detections"
        file: "sigma/proc_creation_win_defender_preference_tampering.yml"
        purpose: "Automates review of process creation events for PowerShell commands that weaken Defender Antivirus"
      - doc: "detections"
        file: "sigma/proc_creation_win_office_spawns_script_interpreter.yml"
        purpose: "Automates review of process creation events for Office applications starting script interpreters"
      - doc: "detections"
        file: "sigma/proc_creation_win_domain_trust_and_group_discovery.yml"
        purpose: "Automates review of process creation events for domain trust, group, and user enumeration"
      - doc: "detections"
        file: "sigma/win_security_kerberos_rc4_service_ticket_user_spn.yml"
        purpose: "Automates review of domain controller event 4769 for RC4 service tickets; runs only where that event is collected"
      - doc: "detections"
        file: "sigma/win_security_replication_rights_non_computer_account.yml"
        purpose: "Automates review of domain controller event 4662 for replication rights use; needs that event collected and a SACL on the domain object"
      - doc: "detections"
        file: "coverage-map.md"
        purpose: "Section 4 lists the behaviors no rule reviews yet, such as medical device segment anomalies and EHR audit and broker session activity"
    notes: ""
