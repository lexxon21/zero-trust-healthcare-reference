# yaml-language-server: $schema=./crosswalk.schema.json
# Reference work. Fictional scenario built for a public portfolio. Not deployed in, derived from, or describing any employer environment. Not professional advice.
#
# Contoso Regional Health (fictional): HIPAA Security Rule crosswalk.
# Source rows: every standard and implementation specification in 45 CFR 164.308, 164.310, 164.312, 164.314, and 164.316.
# Hub: NIST CSF 2.0. Also mapped: the reference architecture's components and documents, the detection pack's
# rules, incident response playbooks, and tabletop exercise kit where they support a row, and PCI DSS v4.0.1 for the Z-CDE segment only.
#
# Format rules, enforced by validate-crosswalk.ps1 (Windows PowerShell 5.1, no modules):
#   2-space indentation; block mappings and block sequences only;
#   every string value in double quotes; bare values limited to true, false, null and [];
#   flow lists contain only double-quoted strings; comments only on their own lines; ASCII only.
schema_version: "1.0"
metadata:
  title: "Contoso Regional Health (fictional): HIPAA Security Rule crosswalk to NIST CSF 2.0, the reference architecture, and PCI DSS v4.0.1 (CDE only)"
  reference_label: "Reference work. Fictional scenario built for a public portfolio. Not deployed in, derived from, or describing any employer environment. Not professional advice."
  scenario: "Contoso Regional Health (fictional)"
  project: "zero-trust-healthcare"
  status: "Reference mapping, status as of 2026-10-07"
  prepared: "2026-10-04"
  statement: "A reference mapping for a fictional scenario, prepared for a public portfolio. It is not an audit, an assessment, an attestation, or an evaluation under 45 CFR 164.308(a)(8), and it certifies nothing. Relationship strengths are an analysis of the published texts."
  frameworks:
    - key: "hipaa-security-rule"
      name: "HIPAA Security Rule"
      version: "45 CFR Part 164 Subpart C, as in force (eCFR text current through 2026-09-30)"
      role: "Source: every standard and implementation specification in 164.308, 164.310, 164.312, 164.314, and 164.316"
    - key: "nist-csf"
      name: "NIST Cybersecurity Framework"
      version: "2.0 (NIST CSWP 29, February 26, 2024)"
      role: "Hub: each applicable HIPAA row maps to CSF 2.0 subcategories"
    - key: "pci-dss"
      name: "PCI DSS"
      version: "v4.0.1 (June 2024)"
      role: "Target for the Z-CDE segment only, under the validation path assumed in A-16"
  pci_numbering_basis: "PCI SSC states that v4.0.1 added and deleted no requirements (SRC-PCI-V401-BLOG), so the numbering verified in the v4.0 SAQs and the v3.2.1 to v4.0 Summary of Changes carries over. v4.0.1 did reword some requirements, so every summary was also checked against PCI SSC's Summary of Changes from v4.0 to v4.0.1 (SRC-PCI-SOC-401-R1). It lists changes to seven of the requirements here (8.4.1, 8.4.2, 8.4.3, 8.5.1, 9.5.1, 12.3.1, and 12.8.2), and those seven list it in verified_against. The 12.3.1 and 8.4.3 summaries follow the v4.0.1 wording it describes; the other five already matched. PCI SSC says that summary does not detail every revision, and the v4.0.1 standard returned HTTP 403 to automated retrieval. Requirement summaries are paraphrased, never reproduced."
  hitrust:
    identifiers_included: false
    decision: "No HITRUST CSF identifiers appear in this crosswalk. The HITRUST CSF License Agreement (HITRUST CSF Version 11.9, effective 2026-09-24) limits use to a licensee's internal purposes, prohibits disclosing the CSF or any data in it, in whole or part, to anyone who is not a licensee or authorized user, and prohibits derivative works, compilations included, without written consent. Public reference is therefore not clearly permitted. See crosswalk.md section 4."
    sources: ["SRC-HITRUST-LICENSE", "SRC-HITRUST-TOU"]
  paths:
    architecture: "../../architecture/zero-trust-healthcare"
    grc: "."
    threat_models: "../../threat-models/zero-trust-healthcare"
    detections: "../../detections/zero-trust-healthcare"
    research: "../../research/zero-trust-healthcare"
  relationship_types:
    - key: "equivalent"
      definition: "The CSF outcome and the HIPAA provision address the same objective at comparable scope for ePHI. Used sparingly; the HIPAA wording still governs."
    - key: "partial"
      definition: "Substantial overlap, but one side has elements the other lacks (scope, specificity, or a required action). Meeting one does not by itself establish the other."
    - key: "related"
      definition: "Same subject area or a supporting relationship. Useful for organizing evidence and context, not for claiming coverage."
  coverage_types:
    - key: "designed"
      definition: "The design set names components that implement the technical substance. The policies and procedures the provision also requires remain organizational work."
    - key: "partial"
      definition: "The design set implements part of the provision; the rest depends on procedures or on systems the design does not cover."
    - key: "procedural"
      definition: "Met by policy, process, or people. The architecture supplies supporting evidence at most."
    - key: "out-of-scope"
      definition: "The design set excludes the subject on purpose (01-scenario-and-assumptions.md, Out of scope). The gap is stated, not hidden."
    - key: "not-applicable"
      definition: "The provision does not apply to Contoso as the scenario defines it."
  applicability_types:
    - key: "applicable"
      definition: "Applies to Contoso as a covered entity."
    - key: "indirect"
      definition: "Binds Contoso's business associates; Contoso's part is the contract term that flows it down."
    - key: "not-applicable"
      definition: "Does not apply as the scenario is defined. The row stays so that coverage of 164.308 to 164.316 is complete."
  pci_path_statuses:
    - key: "required"
      definition: "On SAQ P2PE, the assumed validation path for the card-present channel (A-16)."
    - key: "performed-anyway"
      definition: "Not on SAQ P2PE; the design performs it anyway (04-segmentation.md section 7)."
    - key: "defense-in-depth"
      definition: "Not on SAQ P2PE; the Z-CDE network control is kept as defense in depth."
    - key: "not-applicable-by-design"
      definition: "No Contoso account and no remote path into Z-CDE exists, so the requirement has nothing to act on unless access is created."
    - key: "not-on-saq-p2pe"
      definition: "Not on SAQ P2PE and not performed under the assumed path; required under a full assessment when its condition applies."
  pci_requirements:
    - id: "1.2.3"
      summary: "Keep an accurate network diagram that shows every connection between the CDE and other networks, wireless included."
      verified_against: ["SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-03"
    - id: "1.2.4"
      summary: "Keep an accurate diagram of how account data flows across systems and networks, and update it when the environment changes."
      verified_against: ["SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-03"
    - id: "1.3.1"
      summary: "Allow only necessary inbound traffic into the CDE and deny the rest."
      verified_against: ["SRC-PCI-SOC-R1", "SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-04"
    - id: "1.3.2"
      summary: "Allow only necessary outbound traffic from the CDE and deny the rest."
      verified_against: ["SRC-PCI-SOC-R1", "SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-04"
    - id: "1.3.3"
      summary: "Place network security controls between every wireless network and the CDE so wireless traffic is denied unless it has an authorized business purpose."
      verified_against: ["SRC-PCI-SOC-R1", "SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-04"
    - id: "1.4.1"
      summary: "Place network security controls between trusted and untrusted networks."
      verified_against: ["SRC-PCI-SOC-R1", "SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-04"
    - id: "1.5.1"
      summary: "Apply defined, enforced security controls to any computing device that connects both to untrusted networks and to the CDE."
      verified_against: ["SRC-PCI-SOC-R1", "SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-04"
    - id: "7.2.1"
      summary: "Define an access control model based on business need, job classification and function, and least privilege."
      verified_against: ["SRC-PCI-SOC-R1", "SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-04"
    - id: "7.2.2"
      summary: "Assign access, privileged access included, by job classification and function with the least privileges needed."
      verified_against: ["SRC-PCI-SOC-R1", "SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-04"
    - id: "7.2.4"
      summary: "Review all user accounts and their access, third-party and vendor accounts included, at least every six months; correct inappropriate access and have management acknowledge the result."
      verified_against: ["SRC-PCI-SOC-R1"]
      checked: "2026-10-04"
    - id: "8.2.7"
      summary: "Enable third-party remote access accounts only for the time needed, disable them otherwise, and monitor their use."
      verified_against: ["SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-03"
    - id: "8.4.1"
      summary: "Require multi-factor authentication for non-console administrative access into the CDE."
      verified_against: ["SRC-PCI-SAQ-AEP-40", "SRC-PCI-SOC-401-R1"]
      checked: "2026-10-04"
    - id: "8.4.2"
      summary: "Require multi-factor authentication for all non-console access into the CDE, not only for administrators."
      verified_against: ["SRC-PCI-SOC-R1", "SRC-PCI-SOC-401-R1"]
      checked: "2026-10-04"
    - id: "8.4.3"
      summary: "Require multi-factor authentication for all remote access from outside the entity's network that could reach or affect the CDE, third-party and vendor access included."
      verified_against: ["SRC-PCI-SAQ-AEP-40", "SRC-PCI-SOC-401-R1"]
      checked: "2026-10-04"
    - id: "8.5.1"
      summary: "Configure multi-factor authentication so it resists replay, cannot be bypassed without a documented and time-limited management exception, uses at least two different factor types, and requires every factor to succeed."
      verified_against: ["SRC-PCI-SOC-R1", "SRC-PCI-SOC-401-R1"]
      checked: "2026-10-04"
    - id: "9.5.1"
      summary: "Protect point-of-interaction devices that read cards by physical interaction from tampering and substitution, through a device list, periodic inspection, and staff training."
      verified_against: ["SRC-PCI-SAQ-P2PE-40", "SRC-PCI-SOC-R1", "SRC-PCI-SOC-401-R1"]
      checked: "2026-10-04"
    - id: "9.5.1.1"
      summary: "Keep an up-to-date list of point-of-interaction devices with make and model, location, and serial number or another unique identifier."
      verified_against: ["SRC-PCI-SAQ-P2PE-40"]
      checked: "2026-10-04"
    - id: "9.5.1.2"
      summary: "Inspect point-of-interaction device surfaces periodically for tampering and substitution."
      verified_against: ["SRC-PCI-SAQ-P2PE-40"]
      checked: "2026-10-04"
    - id: "9.5.1.2.1"
      summary: "Set the frequency and type of point-of-interaction inspections through a targeted risk analysis that meets Requirement 12.3.1."
      verified_against: ["SRC-PCI-SOC-R1"]
      checked: "2026-10-04"
    - id: "9.5.1.3"
      summary: "Train staff in point-of-interaction environments to recognize and report tampering or substitution, including verifying the identity of anyone who claims to service a device."
      verified_against: ["SRC-PCI-SAQ-P2PE-40"]
      checked: "2026-10-04"
    - id: "10.2.1"
      summary: "Enable audit logs and keep them active for all system components and cardholder data."
      verified_against: ["SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-03"
    - id: "11.4.5"
      summary: "Where segmentation isolates the CDE, penetration-test the segmentation controls at least every 12 months and after changes to them."
      verified_against: ["SRC-PCI-SAQ-AEP-40"]
      checked: "2026-10-03"
    - id: "12.3.1"
      summary: "For each requirement that calls for a targeted risk analysis, document the analysis and use it to justify how the frequency or process the entity chose limits the likelihood or impact of the threat."
      verified_against: ["SRC-PCI-SOC-R1", "SRC-PCI-SOC-401-R1"]
      checked: "2026-10-04"
    - id: "12.5.2"
      summary: "Document and confirm PCI DSS scope at least every 12 months and after significant change to the in-scope environment."
      verified_against: ["SRC-PCI-SOC-R1"]
      checked: "2026-10-04"
    - id: "12.8.1"
      summary: "Keep a list of third-party service providers that receive account data or could affect its security, with the services each provides."
      verified_against: ["SRC-PCI-SAQ-P2PE-40"]
      checked: "2026-10-04"
    - id: "12.8.2"
      summary: "Keep written agreements in which those providers acknowledge responsibility for the security of account data they handle or could affect."
      verified_against: ["SRC-PCI-SAQ-P2PE-40", "SRC-PCI-SOC-401-R1"]
      checked: "2026-10-04"
    - id: "12.8.3"
      summary: "Follow an established process, due diligence included, before engaging a provider."
      verified_against: ["SRC-PCI-SAQ-P2PE-40"]
      checked: "2026-10-04"
    - id: "12.8.4"
      summary: "Monitor each provider's PCI DSS compliance status at least every 12 months."
      verified_against: ["SRC-PCI-SAQ-P2PE-40"]
      checked: "2026-10-04"
    - id: "12.8.5"
      summary: "Record which requirements each provider manages, which the entity manages, and which are shared."
      verified_against: ["SRC-PCI-SAQ-P2PE-40"]
      checked: "2026-10-04"
    - id: "12.10.1"
      summary: "Keep an incident response plan that is ready to activate for suspected or confirmed security incidents."
      verified_against: ["SRC-PCI-SAQ-P2PE-40", "SRC-PCI-SOC-R1"]
      checked: "2026-10-04"
  csf_subcategories:
    - id: "GV.OC-04"
      outcome: "Critical objectives, capabilities, and services that external stakeholders depend on or expect from the organization are understood and communicated"
    - id: "GV.RM-01"
      outcome: "Risk management objectives are established and agreed to by organizational stakeholders"
    - id: "GV.RM-02"
      outcome: "Risk appetite and risk tolerance statements are established, communicated, and maintained"
    - id: "GV.RR-01"
      outcome: "Organizational leadership is responsible and accountable for cybersecurity risk and fosters a culture that is risk-aware, ethical, and continually improving"
    - id: "GV.RR-02"
      outcome: "Roles, responsibilities, and authorities related to cybersecurity risk management are established, communicated, understood, and enforced"
    - id: "GV.RR-04"
      outcome: "Cybersecurity is included in human resources practices"
    - id: "GV.PO-01"
      outcome: "Policy for managing cybersecurity risks is established based on organizational context, cybersecurity strategy, and priorities and is communicated and enforced"
    - id: "GV.PO-02"
      outcome: "Policy for managing cybersecurity risks is reviewed, updated, communicated, and enforced to reflect changes in requirements, threats, technology, and organizational mission"
    - id: "GV.OV-03"
      outcome: "Organizational cybersecurity risk management performance is evaluated and reviewed for adjustments needed"
    - id: "GV.SC-02"
      outcome: "Cybersecurity roles and responsibilities for suppliers, customers, and partners are established, communicated, and coordinated internally and externally"
    - id: "GV.SC-05"
      outcome: "Requirements to address cybersecurity risks in supply chains are established, prioritized, and integrated into contracts and other types of agreements with suppliers and other relevant third parties"
    - id: "GV.SC-06"
      outcome: "Planning and due diligence are performed to reduce risks before entering into formal supplier or other third-party relationships"
    - id: "GV.SC-07"
      outcome: "The risks posed by a supplier, their products and services, and other third parties are understood, recorded, prioritized, assessed, responded to, and monitored over the course of the relationship"
    - id: "GV.SC-08"
      outcome: "Relevant suppliers and other third parties are included in incident planning, response, and recovery activities"
    - id: "ID.AM-01"
      outcome: "Inventories of hardware managed by the organization are maintained"
    - id: "ID.AM-03"
      outcome: "Representations of the organization's authorized network communication and internal and external network data flows are maintained"
    - id: "ID.AM-04"
      outcome: "Inventories of services provided by suppliers are maintained"
    - id: "ID.AM-05"
      outcome: "Assets are prioritized based on classification, criticality, resources, and impact on the mission"
    - id: "ID.AM-07"
      outcome: "Inventories of data and corresponding metadata for designated data types are maintained"
    - id: "ID.AM-08"
      outcome: "Systems, hardware, software, services, and data are managed throughout their life cycles"
    - id: "ID.RA-01"
      outcome: "Vulnerabilities in assets are identified, validated, and recorded"
    - id: "ID.RA-03"
      outcome: "Internal and external threats to the organization are identified and recorded"
    - id: "ID.RA-04"
      outcome: "Potential impacts and likelihoods of threats exploiting vulnerabilities are identified and recorded"
    - id: "ID.RA-05"
      outcome: "Threats, vulnerabilities, likelihoods, and impacts are used to understand inherent risk and inform risk response prioritization"
    - id: "ID.RA-06"
      outcome: "Risk responses are chosen, prioritized, planned, tracked, and communicated"
    - id: "ID.RA-07"
      outcome: "Changes and exceptions are managed, assessed for risk impact, recorded, and tracked"
    - id: "ID.IM-01"
      outcome: "Improvements are identified from evaluations"
    - id: "ID.IM-02"
      outcome: "Improvements are identified from security tests and exercises, including those done in coordination with suppliers and relevant third parties"
    - id: "ID.IM-04"
      outcome: "Incident response plans and other cybersecurity plans that affect operations are established, communicated, maintained, and improved"
    - id: "PR.AA-01"
      outcome: "Identities and credentials for authorized users, services, and hardware are managed by the organization"
    - id: "PR.AA-02"
      outcome: "Identities are proofed and bound to credentials based on the context of interactions"
    - id: "PR.AA-03"
      outcome: "Users, services, and hardware are authenticated"
    - id: "PR.AA-04"
      outcome: "Identity assertions are protected, conveyed, and verified"
    - id: "PR.AA-05"
      outcome: "Access permissions, entitlements, and authorizations are defined in a policy, managed, enforced, and reviewed, and incorporate the principles of least privilege and separation of duties"
    - id: "PR.AA-06"
      outcome: "Physical access to assets is managed, monitored, and enforced commensurate with risk"
    - id: "PR.AT-01"
      outcome: "Personnel are provided with awareness and training so that they possess the knowledge and skills to perform general tasks with cybersecurity risks in mind"
    - id: "PR.AT-02"
      outcome: "Individuals in specialized roles are provided with awareness and training so that they possess the knowledge and skills to perform relevant tasks with cybersecurity risks in mind"
    - id: "PR.DS-01"
      outcome: "The confidentiality, integrity, and availability of data-at-rest are protected"
    - id: "PR.DS-02"
      outcome: "The confidentiality, integrity, and availability of data-in-transit are protected"
    - id: "PR.DS-10"
      outcome: "The confidentiality, integrity, and availability of data-in-use are protected"
    - id: "PR.DS-11"
      outcome: "Backups of data are created, protected, maintained, and tested"
    - id: "PR.PS-01"
      outcome: "Configuration management practices are established and applied"
    - id: "PR.PS-03"
      outcome: "Hardware is maintained, replaced, and removed commensurate with risk"
    - id: "PR.PS-04"
      outcome: "Log records are generated and made available for continuous monitoring"
    - id: "PR.PS-05"
      outcome: "Installation and execution of unauthorized software are prevented"
    - id: "PR.IR-01"
      outcome: "Networks and environments are protected from unauthorized logical access and usage"
    - id: "PR.IR-03"
      outcome: "Mechanisms are implemented to achieve resilience requirements in normal and adverse situations"
    - id: "DE.CM-02"
      outcome: "The physical environment is monitored to find potentially adverse events"
    - id: "DE.CM-03"
      outcome: "Personnel activity and technology usage are monitored to find potentially adverse events"
    - id: "DE.CM-06"
      outcome: "External service provider activities and services are monitored to find potentially adverse events"
    - id: "DE.CM-09"
      outcome: "Computing hardware and software, runtime environments, and their data are monitored to find potentially adverse events"
    - id: "DE.AE-02"
      outcome: "Potentially adverse events are analyzed to better understand associated activities"
    - id: "DE.AE-03"
      outcome: "Information is correlated from multiple sources"
    - id: "DE.AE-08"
      outcome: "Incidents are declared when adverse events meet the defined incident criteria"
    - id: "RS.MA-01"
      outcome: "The incident response plan is executed in coordination with relevant third parties once an incident is declared"
    - id: "RS.AN-06"
      outcome: "Actions performed during an investigation are recorded, and the records' integrity and provenance are preserved"
    - id: "RS.CO-02"
      outcome: "Internal and external stakeholders are notified of incidents"
    - id: "RS.MI-01"
      outcome: "Incidents are contained"
    - id: "RC.RP-01"
      outcome: "The recovery portion of the incident response plan is executed once initiated from the incident response process"
    - id: "RC.RP-03"
      outcome: "The integrity of backups and other restoration assets is verified before using them for restoration"
    - id: "RC.RP-05"
      outcome: "The integrity of restored assets is verified, systems and services are restored, and normal operating status is confirmed"
